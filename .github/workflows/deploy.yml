name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verificar dominio (dist/CNAME)
        run: test -f dist/CNAME
      - name: Verificar SEO (robots, 404 y páginas prerenderizadas)
        run: |
          test -f dist/robots.txt
          test -f dist/404.html
          test -f dist/privacidad/index.html
          test -f dist/terminos/index.html
      - name: Auditar SEO y rendimiento (informativo)
        run: npm run auditar
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
